name: Renovate
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GITHUB_TOKEN cannot push changes to .github/workflows/, so Renovate
      # lists updates to these actions on the Dependency Dashboard but cannot
      # open their pull requests: bump them by hand.
      - name: Renovate
        uses: renovatebot/github-action@v46.3.15
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_ONBOARDING: "false"
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORY_CACHE: enabled

  # Pull requests pushed with GITHUB_TOKEN wait for approval before their
  # Check runs start. Check what each Renovate pull request would merge into
  # main here instead, and post it as the mirror/check commit status.
  check-prs:
    name: Check Renovate pull requests
    needs: renovate
    if: always() && needs.renovate.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Post a status on each open Renovate pull request
        run: python3 mirror.py check-prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
